about:
  heading: "ATHLETIC IDENTITY"
  paragraphs:
    - "I'm a Tokyo-based <strong>performance athlete and endurance athlete</strong> competing across trail, road, Hyrox, Spartan, and hybrid racing, while building a credible profile for brand partnerships, sponsorships, athlete modelling, and media work."
    - "I've always been an athlete. From the pool to the track, that early foundation built the <strong>values I live by today</strong>. Discipline, consistency, and full commitment."
    - "After stepping away, I returned to competition with a <strong>focus on endurance</strong> across trail, road, and hybrid racing."
    - "<strong>I'm drawn to challenges</strong> that physically and mentally demand more. My approach is simple: show up, do the work, and push beyond what I thought was possible."
    - "For me, <strong>performance is built in the process</strong>, every day. That standard doesn't change."
