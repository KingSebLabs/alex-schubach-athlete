# ─── ABOUT ───────────────────────────────────────────────────────────────────
about:
  heading: "MY STORY"
  paragraphs:
    - "I've been an athlete for as long as I can remember. I started in the pool as a <strong>competitive swimmer</strong>, then moved to the track in my teenage years. That foundation built something that has never left me. <strong>Discipline, consistency, and a commitment to getting better every day.</strong>"
    - "Now, my focus is endurance. <strong>Trail running, road racing, and hybrid competition like Hyrox.</strong> I'm drawn to environments that demand more, where <strong>physical and mental limits</strong> are constantly tested. I don't see limits as fixed. They are something to be challenged, pushed, and redefined."
    - "My approach is simple. <strong>Show up, do the work,</strong> and find out what is actually possible. The outcome matters, but what drives me is <strong>the process.</strong> The chase of going beyond what I thought I was capable of."
    - "Outside of competition, I live a lifestyle built around <strong>movement, the outdoors, and purpose.</strong> Training is not something I switch on and off. It is how I live. <strong>Every session, every race, every day</strong> is an opportunity to push further and raise the standard."
  stats:
    - number: "10+"
      label: "Years Competing"
    - number: "Hybrid"
      label: "Athlete Style"
    - number: "JP"
      label: "Based in Japan"
    - number: "∞"
      label: "Potential"

# ─── VALUES ──────────────────────────────────────────────────────────────────
values:
  - num: "01"
    title: "FULL SEND"
    desc: "Half-effort doesn't exist in my vocabulary. Whatever I take on, I put everything into it. No holding back, no excuses, I'm all in."
  - num: "02"
    title: "THE PURSUIT OF MORE"
    desc: "We don't know where our limits are until we push past where we thought they were. That chase is what drives me."
  - num: "03"
    title: "BUILT FOR THE OUTDOORS"
    desc: "I live and breathe movement. Nature isn't just a backdrop — it's where I feel the most alive. The trails, the peaks, the open water. There's always somewhere new to explore."
  - num: "04"
    title: "SHOW UP EVERYDAY"
    desc: "Motivation is unreliable. Discipline isn't. The work gets done regardless of how I feel because consistency compounds. And that's what separates the good from the great."

# ─── MISSION ─────────────────────────────────────────────────────────────────
mission:
  quote: "My mission isn't simply to inspire people to be active. It's to show that <span>ordinary people can achieve extraordinary things</span> when they commit fully."
  body: "Through my races and my journey, I want to encourage people to realise their potential, find what they're passionate about, and push beyond what they think is possible."
  pillars:
    - "Realise your potential"
    - "Find your passion"
    - "Commit fully to it"
    - "Push beyond your limits"

