  body: "Whether it's a brand partnership, media opportunity, or collaboration — I'd love to hear from you."
  # Formspree endpoint — sign up at formspree.io and paste your form ID here
  formspree_id: "mjgazkbq"
  categories:
    - icon: "🤝"
      label: "Brand Partnerships"
      desc: "I work with brands built on performance, quality, and intent. I'm specifically interested in partnerships across sports & fitness gear, outdoor & adventure, health & nutrition, and lifestyle & apparel. I value brands that are pushing boundaries, not following trends. If your product can hold up under real training, competition, and daily use, that's where I see alignment. I'm focused on long-term partnerships that are integrated, authentic, and built through performance, not just promotion."
    - icon: "📸"
      label: "Media Inquiries"
      desc: "I'm open to media opportunities that focus on high performance, endurance sport, and the reality of pushing physical and mental limits. This includes interviews, features, podcasts, and performance-driven content. I'm interested in conversations that go beyond surface level, into training, discipline, mindset, and what it actually takes to operate at a high level while building something meaningful."
    - icon: "✦"
      label: "Collaborations"
      desc: "I collaborate with athletes, creators, and teams who are serious about what they do. Whether it's performance, storytelling, or building something in sport, travel, or culture, I'm interested in projects that have intent behind them. If you're pushing limits, creating at a high level, or building something with purpose, I'm open to working together."

