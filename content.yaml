# ─── ABOUT ───────────────────────────────────────────────────────────────────
about:
  heading: "ATHLETIC IDENTITY"
  paragraphs:
    - "I've always been an athlete. From the pool to the track, that early foundation built the values I live by today: <strong>discipline</strong>, <strong>consistency</strong>, and <strong>full commitment</strong>."
    - "After stepping away, I returned to competition with a focus on endurance across trail, road, and hybrid racing."
    - "I'm drawn to challenges that physically and mentally demand more. My approach is simple: show up, do the work, and push beyond what I thought was possible."
    - "For me, performance is built in the process, every day. That standard doesn't change."
  stats:
    - number: "JP"
      label: "Based in Japan"
    - number: "10+"
      label: "Years Competing"
    - number: "Hybrid"
      label: "Athlete Style"
    - number: "∞"
      label: "Potential"

# ─── VALUES ──────────────────────────────────────────────────────────────────
values:
  - num: "01"
    title: "FULL SEND"
    desc: "Half-effort doesn't exist in my vocabulary. Whatever I take on, I put everything into it. No holding back, no excuses, I'm all in."
  - num: "02"
    title: "THE PURSUIT OF MORE"
    desc: "We don't know where our limits are until we push past where we thought they were. That chase is what drives me."
  - num: "03"
    title: "HOLD THE STANDARD"
    desc: "The level I expect from myself doesn't drop when it's hard, inconvenient, or uncomfortable. It stays fixed. No matter what."
  - num: "04"
    title: "SHOW UP EVERYDAY"
    desc: "Motivation is unreliable. Discipline isn't. The work gets done regardless of how I feel because consistency compounds. And that's what separates the good from the great."

# ─── MISSION ─────────────────────────────────────────────────────────────────
mission:
  quote: "<span>This isn't about motivation.</span> It's about setting a standard and showing what's possible when you live by it."
  body: "Through my journey, I show that limits are self-imposed.<br><br>When you get clear on what really matters and commit fully to it, you can operate at a level you didn't think was possible.<br><br>And achieve more than you ever thought you were capable of."
  pillars_heading: "THE STANDARD"
  pillars:
    - "Train daily, regardless of conditions"
    - "Track performance across all key metrics"
    - "Compete consistently across hybrid and endurance racing"
    - "Execute with discipline, not emotion"
    - "Live the standard, on and off the field"

