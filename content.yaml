# ─── ABOUT ───────────────────────────────────────────────────────────────────
about:
  heading: "MY STORY"
  paragraphs:
    - "<strong>I've been an athlete</strong> for as long as I can remember. It started in the pool as a competitive swimmer and sprinter, then onto the track in high school where middle distance is where I made my mark. That foundation built something that has never left me - focus, discipline, consistency, and a <strong>commitment to giving everything</strong> I do my best effort."
    - "After ten years in the corporate grind, I'm back competing and doing what I really enjoy. Now, my <strong>focus is endurance</strong> - trail running, road racing, and hybrid events like Hyrox and Spartan. I'm drawn to <strong>environments that demand more</strong>, both physically and mentally. There's nothing quite like finding your limit and then pushing right past it."
    - "My <strong>approach is simple</strong>. Show up everyday, do the work, and find out what's actually possible. The outcome matters, but <strong>what drives me is the process</strong> - the relentless pursuit of going beyond what I thought I was capable of."
    - "Training is not something I switch on and off. It's how I live. Every session, every race, every day is an <strong>opportunity to do and be my best</strong>, and raise the standard."
  stats:
    - number: "JP"
      label: "Based in Japan"
    - number: "10+"
      label: "Years Competing"
    - number: "Hybrid"
      label: "Athlete Style"
    - number: "∞"
      label: "Potential"

# ─── VALUES ──────────────────────────────────────────────────────────────────
values:
  - num: "01"
    title: "FULL SEND"
    desc: "Half-effort doesn't exist in my vocabulary. Whatever I take on, I put everything into it. No holding back, no excuses, I'm all in."
  - num: "02"
    title: "THE PURSUIT OF MORE"
    desc: "We don't know where our limits are until we push past where we thought they were. That chase is what drives me."
  - num: "03"
    title: "BUILT FOR THE OUTDOORS"
    desc: "I live and breathe movement. Nature isn't just a backdrop — it's where I feel the most alive. The trails, the peaks, the open water. There's always somewhere new to explore."
  - num: "04"
    title: "SHOW UP EVERYDAY"
    desc: "Motivation is unreliable. Discipline isn't. The work gets done regardless of how I feel because consistency compounds. And that's what separates the good from the great."

# ─── MISSION ─────────────────────────────────────────────────────────────────
mission:
  quote: "My mission isn't just to inspire people to be active. It's to show that <span>when people commit fully, they're capable of more</span> than they realise."
  body: "Through my journey, I want to encourage people to find what they're passionate about, realise their potential, and push beyond what they think is possible."
  pillars:
    - "Find your passion"
    - "Realise your potential"
    - "Commit fully to it"
    - "Push beyond your limits"

