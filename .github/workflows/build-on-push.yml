name: Build site on push

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r build/requirements.txt

      - name: Build site
        run: python build/build.py

      - name: Verify build
        run: |
          python3 -c "
          import json, os
          content = open('index.html').read()
          assert '<title>' in content, 'Missing title tag'
          assert 'race-item' in content, 'Missing race cards'
          assert len(content) > 100000, f'Output too small: {len(content)} bytes'
          assert not os.path.exists('races.json') or isinstance(json.load(open('races.json')), list), 'races.json is not a JSON list'
          print('Build verified:', len(content), 'bytes')
          "

      - name: Commit updated files (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sponsor-and-partnership-media-kit.html sitemap.xml robots.txt llms.txt races.json index.md profile.md results.md calendar.md media-kit.md partnerships.md gallery.md values.md mission.md .nojekyll images/
          git diff --staged --quiet || git commit -m "Auto-build: update site [skip ci]"
          git pull --rebase
          git push
